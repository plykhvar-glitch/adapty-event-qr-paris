<style>
/* One screen, held up to a stranger's camera: Adapty violet night, one white QR tile, nothing else competing. */
:root{
  color-scheme:dark;
  --night:#120A33; --deep:#2A0E8F; --violet:#6720FF; --lilac:#CDC0F5; --ink:#FFFFFF; --soft:rgba(255,255,255,.72); --faint:rgba(255,255,255,.14); --tile:#FFFFFF; --code:#000000;
  --fd:'Manrope',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
html,body{height:100%;margin:0}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(120% 70% at 85% -10%,var(--violet) 0%,rgba(103,32,255,0) 60%),radial-gradient(90% 60% at -10% 110%,var(--deep) 0%,rgba(42,14,143,0) 65%);}
.app{height:100%;display:flex;flex-direction:column;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;max-width:520px;margin:0 auto;position:relative}
.mk{position:absolute;right:-60px;top:-30px;width:260px;opacity:.08;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:22px;width:auto;color:var(--ink)}
.logo .m{color:var(--lilac)}
.where{font:600 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--lilac)}
.seg{display:flex;gap:4px;margin-top:18px;background:var(--faint);border-radius:999px;padding:4px}
.seg button{flex:1;height:42px;border:0;border-radius:999px;background:none;color:var(--soft);font:700 15px/1 var(--fd);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button img{width:22px;height:22px;border-radius:6px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--night)}
.seg button:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;touch-action:pan-y;padding-top:10px}
.who{display:flex;align-items:center;gap:12px;align-self:stretch}
.who img{width:52px;height:52px;border-radius:13px;flex:none}
.who small{display:block;font:600 11px/1.2 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--lilac)}
.who b{display:block;font:800 30px/1.05 var(--fd);letter-spacing:-.02em;margin-top:3px}
.who span{display:block;font-size:13.5px;color:var(--soft);margin-top:3px}
.tile{width:100%;max-width:min(100%,58vh);aspect-ratio:1;background:var(--tile);border-radius:28px;padding:9%;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);transition:transform .25s ease,opacity .25s ease}
.tile svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}
.tile.swap{opacity:0;transform:scale(.97)}
.cap{text-align:center}
.cap b{display:block;font:800 19px/1.2 var(--fd)}
.cap span{display:block;font-size:12.5px;color:var(--soft);margin-top:6px;word-break:break-all;user-select:all}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dots i.on{background:var(--lilac)}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
@media(max-height:640px){.who img{width:40px;height:40px}.who b{font-size:24px}.seg{margin-top:12px}}
</style>
</head>

    [].forEach.call(seg.children,function(b,j){ b.setAttribute('aria-selected',j===cur?'true':'false'); });
    [].forEach.call(document.getElementById('dots').children,function(d,j){ d.className=j===cur?'on':''; });
    if(location.hash!=='#'+a.k){ try{ history.replaceState(null,'','#'+a.k); }catch(e){} }
  }
  if(anim){ tile.classList.add('swap'); setTimeout(function(){ paint(); tile.classList.remove('swap'); },160); } else paint();
}
seg.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) show(+b.dataset.i,true); });
var sx=null; var st=document.getElementById('stage');
st.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
st.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>50) show(cur+(dx<0?1:-1),true); });
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') show(cur+1,true); if(e.key==='ArrowLeft') show(cur-1,true); });
function fromHash(){ var k=location.hash.slice(1), i=APPS.map(function(a){ return a.k; }).indexOf(k); show(i<0?0:i,false); }
addEventListener('hashchange',fromHash); fromHash();
/* keep the screen awake while it is held up at the booth */
(function(){ var lock=null; function req(){ if(!navigator.wakeLock||document.hidden) return; navigator.wakeLock.request('screen').then(function(l){ lock=l; }).catch(function(){}); }
  req(); document.addEventListener('visibilitychange',function(){ if(!document.hidden) req(); }); document.addEventListener('click',req,{once:true}); })();
</script>
